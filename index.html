<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filtr wykonawcy i FF - radiobuttony i checkboxy</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  .filter-label {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .radio-tab-group,
  .checkbox-group {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  /* Ukrycie radiobuttonów i checkboxów */
  input[type="radio"],
  input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  /* Styl etykiet jako przyciski/zakładki */
  .radio-tab-group label,
  .checkbox-group label {
    cursor: pointer;
    padding: 8px 22px;
    border: 1px solid #ccc;
    border-radius: 4px 4px 0 0;
    background-color: #f0f0f0;
    user-select: none;
    transition: background-color 0.3s, border-color 0.3s;
    font-weight: normal;
    color: #333;
    outline-offset: 2px;
    outline: none;
    flex-shrink: 0;
  }

  .radio-tab-group label:focus,
  .checkbox-group label:focus {
    outline: 2px solid #0078d7;
  }

  /* Dla radiobuttonów: tylko jeden jest aktywny */
  .radio-tab-group label:not(:last-child) {
    border-right: none;
  }
  input[type="radio"]:checked + label {
    background-color: white;
    border-color: #0078d7 #0078d7 white #0078d7;
    font-weight: bold;
    color: #0078d7;
    position: relative;
    top: 1px;
    z-index: 1;
  }

  /* Dla checkboxów: mogą być zaznaczone niezależnie */
  input[type="checkbox"]:checked + label {
    background-color: white;
    border-color: #0078d7;
    font-weight: bold;
    color: #0078d7;
    position: relative;
    z-index: 1;
    border-radius: 4px;
  }

  /* Dodatkowo dla checkboxów zaokrąglenie przycisków nieco inne */
  .checkbox-group label {
    border-radius: 4px;
  }
</style>
</head>
<body>
