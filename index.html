<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moja kolekcja kaset ECHOJAM</title>
<link rel="icon" href="favicon/favicon.ico" type="image/x-icon" />
<style>
  .tile {
    border: 5px solid #ddd;
    padding: 8px;
    margin: 8px;
    width: 288px;
    float: left;
    font-family: sans-serif;
  }

  .tile img {
    max-width: 100%;
    height: auto;
  }

  .thumbnail-container {
    width: 100%;
    height: 280px;
    background: white;
    color: grey;
    font-size: 12em;
  }

  .thumbnail-container p {
    display: block;
    margin-block-start: 0em;
    margin-block-end: 0em;
    margin-inline-start: 0px;
    margin-inline-end: 0px;
  }

  .copy-icon {
    display: inline-block;
    cursor: pointer;
    font-size: 8px;
  }

  .tile:hover .copy-icon {
    text-decoration: underline;
  }

  .filter-label {
    font-weight: bold;
    margin-bottom: 4px;
    font-family: sans-serif;
  }

  .radio-tab-group,
  .checkbox-group {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  input[type="radio"],
  input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .radio-tab-group label,
  .checkbox-group label {
    cursor: pointer;
    padding: 8px 20px;
    border: 1px solid #ccc;
    border-radius: 4px 4px 0 0;
    background-color: #f0f0f0;
    user-select: none;
    transition: background-color 0.3s, border-color 0.3s;
    font-weight: normal;
    color: #333;
    outline-offset: 2px;
    outline: none;
    flex-shrink: 0;
  }

  .radio-tab-group label:focus,
  .checkbox-group label:focus {
    outline: 2px solid #0078d7;
  }

  .radio-tab-group label:not(:last-child) {
    border-right: none;
  }

  input[type="radio"]:checked + label {
    background-color: white;
    border-color: #0078d7 #0078d7 white #0078d7;
    font-weight: bold;
    color: #0078d7;
    position: relative;
    top: 1px;
    z-index: 1;
  }

  input[type="checkbox"]:checked + label {
    background-color: white;
    border-color: #0078d7;
    font-weight: bold;
    color: #0078d7;
    position: relative;
    z-index: 1;
    border-radius: 4px;
  }

  #tiles-container::after {
    content: "";
    display: table;
    clear: both;
  }
</style>
</head>
<body>

<h1>Moja kolekcja kaset ECHOJAM</h1>

<div class="filter-label" id="label-filter">Filtr wykonawcy</div>
<div class="radio-tab-group" role="radiogroup" aria-labelledby="label-filter">
  <input type="radio" id="filter-all" name="filter" value="all" checked />
  <label for="filter-all" tabindex="0">WSZYSTKO</label>

  <input type="radio" id="filter-owned" name="filter" value="owned" />
  <label for="filter-owned" tabindex="0">MAM</label>

  <input type="radio" id="filter-wanted" name="filter" value="wanted" />
  <label for="filter-wanted" tabindex="0">SZUKAM</label>

  <input type="radio" id="filter-duble" name="filter" value="duble" />
  <label for="filter-duble" tabindex="0">DUBLE</label>
</div>

<div class="filter-label" id="label-ff" style="margin-top: 16px;">Wybierz FF</div>
<div class="checkbox-group" role="group" aria-labelledby="label-ff">
  <input type="checkbox" id="ff-echo" name="ff" value="echo" checked />
  <label for="ff-echo" tabindex="0">ECHO</label>

  <input type="checkbox" id="ff-jam" name="ff" value="jam" checked />
  <label for="ff-jam" tabindex="0">JAM</label>
</div>

<label for="search">Wyszukaj:</label>
<input type="text" id="search" style="padding: 6px; width: 100%; max-width: 300px;" />

<div id="tiles-container"></div>

<script>
  const sheetUrlCSV = 'https://docs.google.com/spreadsheets/d/1hTaNoVxeK5HBXI7FHMMPKznvILbudUpxgRslYouw34Q/export?format=csv';

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    return lines.map(line => line.split(',').map(cell => cell.trim()));
  }

  async function fetchData(filter, searchQuery, selectedFFs) {
    try {
      const response = await fetch(sheetUrlCSV);
      if (!response.ok) throw new Error('Nie udało się pobrać danych z arkusza');
      const csvText = await response.text();
      const rows = parseCSV(csvText);

      const headers = rows[0];
      const dataRows = rows.slice(1);

      const idxWytwornia = 0;
      const idxNr = 2;
      const idxArtysta = 3;
      const idxAlbum = 4;
      const idxIlosc = 6;
      const idxKolor = 9;
      const idxMiniatura = 10;

      const rowData = dataRows.map(cols => ({
        wytwornia: cols[idxWytwornia],
        nr: cols[idxNr],
        artysta: cols[idxArtysta],
        album: cols[idxAlbum],
        ilosc: parseInt(cols[idxIlosc]) || 0,
        kolor: cols[idxKolor],
        miniatura: cols[idxMiniatura] || '',
        ff: cols[idxWytwornia].toLowerCase().includes('echo') ? 'echo' : (cols[idxWytwornia].toLowerCase().includes('jam') ? 'jam' : '')
      }));

      renderTiles(rowData, filter, searchQuery, selectedFFs);
    } catch (error) {
      console.error('Błąd pobierania danych:', error);
      const tilesContainer = document.getElementById('tiles-container');
      tilesContainer.innerHTML = '<p style="color:red">Błąd pobierania danych z arkusza. Sprawdź konsolę.</p>';
    }
  }

  function renderTiles(data, filter, searchQuery, selectedFFs) {
    const tilesContainer = document.getElementById('tiles-container');
    tilesContainer.innerHTML = '';

    const searchLower = searchQuery.toLowerCase();

    const filteredData = data.filter(item => {
      let filterCondition = false;
      switch (filter) {
        case 'all': filterCondition = true; break;
        case 'owned': filterCondition = item.ilosc > 0; break;
        case 'wanted': filterCondition = item.ilosc === 0; break;
        case 'duble': filterCondition = item.ilosc === 1; break;
        default: filterCondition = false;
      }
      const ffCondition = selectedFFs.length === 0 ? true : selectedFFs.includes(item.ff);
      const textToSearch = (item.artysta + ' ' + item.album + ' ' + item.wytwornia).toLowerCase();
      const searchCondition = textToSearch.includes(searchLower);
      return filterCondition && ffCondition && searchCondition;
    });

    if (filteredData.length === 0) {
      tilesContainer.innerHTML = '<p>Brak wyników spełniających kryteria.</p>';
      return;
    }

    filteredData.forEach(item => {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.style.backgroundColor = item.kolor ? item.kolor.toLowerCase() : '#555555';
      tile.style.color = (item.kolor && item.kolor.toLowerCase() === '#000000') ? 'gold' : 'white';
      tile.style.width = '280px';
      tile.style.height = '450px';
      tile.style.border = item.ilosc === 0 ? '5px solid red' : '5px solid #ddd';

      const thumbnailContainer = document.createElement('div');
      thumbnailContainer.classList.add('thumbnail-container');
      thumbnailContainer.style.width = '100%';
      thumbnailContainer.style.height = '280px';

      if (item.miniatura) {
        const imageElement = document.createElement('img');
        imageElement.src = item.miniatura;
        imageElement.loading = 'lazy';
        imageElement.style.maxWidth = '100%';
        imageElement.style.height = 'auto';
        thumbnailContainer.appendChild(imageElement);
      } else {
        thumbnailContainer.style.background = '#000000';
      }

      tile.appendChild(thumbnailContainer);

      const artistElement = document.createElement('p');
      artistElement.innerHTML = `<strong>Artysta:</strong> ${item.artysta}`;
      tile.appendChild(artistElement);

      const albumElement = document.createElement('p');
      albumElement.innerHTML = `Album: ${item.album}`;
      tile.appendChild(albumElement
