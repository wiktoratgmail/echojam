<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moja kolekcja kaset ECHO/JAM</title>
<link rel="icon" href="favicon/favicon.ico" type="image/x-icon" />
<style>
  :root{ --gap:12px; --radius:8px; --line:#d0d0d0; --text:#111; --muted:#666; --chip:#f6f6f6;}
  body{ font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); margin:16px;}
  /* Toolbar */
  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--gap); margin-bottom:10px;}
  .group{ display:flex; align-items:center; gap:8px;}
  .group label.lbl{ min-width:88px; text-align:right; color:var(--muted); font-weight:600;}
  .tabs{ display:flex; gap:4px; align-items:flex-end;}
  .tabs input[type="radio"]{ display:none;}
  .tab-label{
    padding:8px 14px; border:1px solid var(--line); border-bottom:none; border-top-left-radius:var(--radius);
    border-top-right-radius:var(--radius); background:#f2f2f2; cursor:pointer; font-weight:700; user-select:none;
  }
  .tabs input[type="radio"]:checked + label{ background:#fff; border-color:#aaa; position:relative; top:1px;}
  .tabs-underline{ width:100%; height:1px; background:#aaa; margin-top:-1px; margin-bottom:6px;}
  /* FF chips */
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:var(--chip);}
  .chip input{ transform:scale(1.1);}
  /* Inputs */
  .text{ padding:6px 10px; border:1px solid #ccc; border-radius:6px; min-width:220px;}
  .text.small{ min-width:120px; width:160px;}
  /* Tiles */
  #tiles-container::after{ content:""; display:block; clear:both;}
  .tile{ border:5px solid #ddd; padding:8px; margin:8px; width:280px; height:450px; float:left; text-align:center; text-transform:uppercase; color:#fff; font-family:sans-serif;}
  .thumbnail-container{ width:100%; height:280px; background:#fff; color:grey; font-size:12em;}
  .thumbnail-container p{ margin:0;}
  .tile img{ max-width:100%; height:auto;}
  .copy-icon{ display:inline-block; cursor:pointer; font-size:11px; margin-left:6px; text-transform:none; }
  .tile:hover .copy-icon{ text-decoration:underline; }
</style>
</head>
<body>

  <div class="toolbar">
    <!-- Zakładki -->
    <div class="tabs" id="stock-tabs">
      <input type="radio" name="tab" id="tab-all" value="all" checked><label class="tab-label" for="tab-all">WSZYSTKO</label>
      <input type="radio" name="tab" id="tab-owned" value="owned"><label class="tab-label" for="tab-owned">MAM</label>
      <input type="radio" name="tab" id="tab-wanted" value="wanted"><label class="tab-label" for="tab-wanted">SZUKAM</label>
      <input type="radio" name="tab" id="tab-duble" value="duble"><label class="tab-label" for="tab-duble">DUBLE</label>
    </div>

    <div class="tabs-underline"></div>

    <!-- FF -->
    <div class="group">
      <label class="lbl">FF:</label>
      <label class="chip"><input type="checkbox" id="ff-echo" checked> ECHO</label>
      <label class="chip"><input type="checkbox" id="ff-jam" checked> JAM</label>
    </div>

    <!-- Wyszukaj -->
    <div class="group">
      <label class="lbl" for="search">Wyszukaj:</label>
      <input class="text" type="text" id="search" placeholder="artysta / album / FF"/>
    </div>

    <!-- Nr katalogowy -->
    <div class="group">
      <label class="lbl" for="search-nr">Nr kat.:</label>
      <input class="text small" type="text" id="search-nr" placeholder="np. EC022"/>
    </div>
  </div>

  <div id="tiles-container"></div>

<script>
  // Jeśli arkusz nie jest pierwszą zakładką, dopisz &gid=XXXX
  const sheetUrlCSV =
    'https://docs.google.com/spreadsheets/d/1hTaNoVxeK5HBXI7FHMMPKznvILbudUpxgRslYouw34Q/export?format=csv';

  // --- Parser CSV z auto-wykryciem separatora i obsługą cudzysłowów ---
  function detectDelimiter(firstLine){
    const counts = [
      {d:',', c:(firstLine.match(/,/g)||[]).length},
      {d:';', c:(firstLine.match(/;/g)||[]).length},
      {d:'\t',c:(firstLine.match(/\t/g)||[]).length},
    ].sort((a,b)=>b.c-a.c);
    return counts[0].c>0 ? counts[0].d : ',';
  }
  function parseCSV(text){
    // Normalizuj końce linii do \n
    text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    const delim = detectDelimiter(text.split('\n',1)[0]||',');
    const rows = [];
    let i=0, field='', row=[], inQ=false;
    while(i<text.length){
      const c=text[i], n=text[i+1];
      if(c==='"' && n==='"'){ field+='"'; i+=2; continue; }
      if(c==='"'){ inQ=!inQ; i++; continue; }
      if(c===delim && !inQ){ row.push(field); field=''; i++; continue; }
      if(c==='\n' && !inQ){ row.push(field); rows.push(row); field=''; row=[]; i++; continue; }
      field+=c; i++;
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.map(r=>r.map(v=>(v||'').trim()));
  }

  // --- Mapowanie kolumn po nagłówkach + fallback do starego układu ---
  function buildIndexMap(headers){
    const norm = s => (s||'').toLowerCase().replace(/\s+/g,' ').replace(/[_-]+/g,' ').trim();
    const find = (alts) => {
      for(const a of alts){
        const i = headers.findIndex(h => norm(h).includes(a));
        if(i>=0) return i;
      }
      return -1;
    };
    let idx = {
      ff:        find(['ff','wytwornia','label']),
      nr:        find(['nr katalogowy','nr','katalog']),
      artysta:   find(['artysta','wykonawca','zespół','zespol']),
      album:     find(['album','tytuł','tytul']),
      ilosc:     find(['ilość','ilosc','qty','quantity']),
      kolor:     find(['kolor','color','bg']),
      miniatura: find(['miniatura','okładka','okladka','cover','thumb'])
    };
    // Fallback gdy nie znaleziono (z Twojego układu)
    const fallback = {ff:0, nr:2, artysta:3, album:4, ilosc:6, kolor:9, miniatura:10};
    for(const k of Object.keys(fallback)){
      if(idx[k] < 0 && headers.length > fallback[k]) idx[k] = fallback[k];
    }
    return idx;
  }

  let cachedRows=null;

  async function fetchData(){
    if(cachedRows) return cachedRows;
    const resp = await fetch(sheetUrlCSV, {cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const txt = await resp.text();
    const rows = parseCSV(txt);
    if(!rows.length || !rows[0] || rows[0].length<2) throw new Error('Nieprawidłowy CSV');
    cachedRows = rows;
    return rows;
  }

  function getActiveStockFilter(){
    const el = document.querySelector('#stock-tabs input[type="radio"]:checked');
    return el ? el.value : 'all';
  }

  function getActiveFFFilters(){
    const echo = document.getElementById('ff-echo').checked;
    const jam  = document.getElementById('ff-jam').checked;
    // Jeśli nic nie zaznaczone (np. po autowypełnieniu przeglądarki) – traktuj jak oba zaznaczone
    if(!echo && !jam) return ['echo','jam'];
    const out=[];
    if(echo) out.push('echo');
    if(jam)  out.push('jam');
    return out;
  }

  async function applyFiltersAndRender(){
    try{
      const rows = await fetchData();
      const headers = rows[0];
      const dataRows = rows.slice(1);
      const idx = buildIndexMap(headers);

      const mapped = dataRows
        .filter(r => r && r.length)
        .map(cols => ({
          ff:        (cols[idx.ff]||'').trim(),
          nr:        (cols[idx.nr]||'').trim(),
          artysta:   (cols[idx.artysta]||'').trim(),
          album:     (cols[idx.album]||'').trim(),
          ilosc:     parseInt(cols[idx.ilosc],10) || 0,
          kolor:     idx.kolor>=0 ? (cols[idx.kolor]||'').trim() : '',
          miniatura: idx.miniatura>=0 ? (cols[idx.miniatura]||'').trim() : ''
        }))
        .filter(r => r.nr!=='' || r.artysta!=='' || r.album!=='');

      const stock = getActiveStockFilter();
      const ffSel = getActiveFFFilters();
      const q    = (document.getElementById('search').value||'').toLowerCase();
      const qNr  = (document.getElementById('search-nr').value||'').toLowerCase();

      renderTiles(mapped, {stock, ffSel, q, qNr});
    }catch(e){
      console.error('Błąd wczytywania:', e);
      document.getElementById('tiles-container').innerHTML =
        '<p style="color:red">Nie udało się wczytać danych z arkusza. Sprawdź uprawnienia i konsolę.</p>';
    }
  }

  function renderTiles(data, {stock, ffSel, q, qNr}){
    const box = document.getElementById('tiles-container');
    box.innerHTML = '';

    const filtered = data.filter(it=>{
      const il = it.ilosc|0;
      const stockOK =
        stock==='all' ||
        (stock==='owned'  && il>0) ||
        (stock==='wanted' && il<1) ||
        (stock==='duble'  && il>1);

      const ffLower = (it.ff||'').toLowerCase();
      const ffOK = ffSel.includes(ffLower); // ffSel ma zawsze co najmniej 1 opcję

      const searchOK = q==='' ||
        (it.artysta||'').toLowerCase().includes(q) ||
        (it.album||'').toLowerCase().includes(q)  ||
        ffLower.includes(q);

      const nrOK = qNr==='' || (it.nr||'').toLowerCase().includes(qNr);

      return stockOK && ffOK && searchOK && nrOK;
    });

    filtered.forEach(it => box.appendChild(createTile(it)));
  }

  function createTile(item){
    const { ff, nr, artysta, album, ilosc, kolor, miniatura } = item;
    const tile = document.createElement('div');
    tile.className = 'tile';

    const bg = (kolor||'#555555').toLowerCase();
    tile.style.backgroundColor = bg;
    tile.style.color = bg==='#000000' ? 'gold' : 'white';
    tile.style.border = ilosc===0 ? '5px solid red' : '5px solid #ddd';

    // Miniatura
    const wrap = document.createElement('div');
    wrap.className = 'thumbnail-container';
    const imgBox = document.createElement('div');
    imgBox.className = 'thumbnail-image';
    if(miniatura){
      const img = document.createElement('img');
      img.loading='lazy'; img.src = miniatura;
      imgBox.appendChild(img); wrap.appendChild(imgBox);
    }else if(bg==='#000000'){
      wrap.style.background = '#000';
    }else{
      imgBox.innerHTML = '<p><strong>?</strong></p>'; wrap.appendChild(imgBox);
    }
    tile.appendChild(wrap);

    // Teksty
    const pA = document.createElement('p');
    pA.innerHTML = `<strong>${escapeHTML(artysta)}</strong><span class="copy-icon" onclick="copyToClipboard('${jsEscape(artysta)}')">(kopiuj)</span>`;
    tile.appendChild(pA);

    const pB = document.createElement('p');
    pB.innerHTML = `${escapeHTML(album)}<span class="copy-icon" onclick="copyToClipboard('${jsEscape(album)}')">(kopiuj)</span>`;
    tile.appendChild(pB);

    if(ilosc>0){
      const pQ = document.createElement('p'); pQ.innerHTML = `Ilość: <strong>${ilosc}</strong>`; tile.appendChild(pQ);
    }else{
      const q = encodeURIComponent(`${artysta} ${album}`);
      const pL = document.createElement('p');
      pL.innerHTML = `
        <a href="https://allegro.pl/listing?string=${q}&nosnik=Kaseta" target="_blank">Allegro</a> |
        <a href="https://www.olx.pl/muzyka-edukacja/muzyka/kasety-audio/q-${q}/" target="_blank">OLX</a> |
        <a href="https://www.vinted.pl/catalog?search_text=${q}&catalog[]=3038&page=1" target="_blank">Vinted</a>`;
      tile.appendChild(pL);
    }

    const pF = document.createElement('p'); pF.textContent = `${ff} - ${nr}`; tile.appendChild(pF);
    return tile;
  }

  function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
  function jsEscape(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  function copyToClipboard(text){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }

  // Zdarzenia
  ['search','search-nr','ff-echo','ff-jam'].forEach(id=>{
    document.getElementById(id).addEventListener(id.startsWith('ff-')?'change':'input', applyFiltersAndRender);
  });
  document.querySelectorAll('#stock-tabs input[type="radio"]').forEach(r=>r.addEventListener('change', applyFiltersAndRender));

  window.onload = applyFiltersAndRender;
</script>
</body>
</html>
