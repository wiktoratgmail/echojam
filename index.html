<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="icon" href="favicon/favicon.ico" type="image/x-icon" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moja kolekcja kaset ECHO/JAM</title>
<style>
  /* Kafle */
  .tile {
    border: 5px solid #ddd;
    padding: 8px;
    margin: 8px;
    width: 288px;
    float: left;
    text-align: center;
    text-transform: uppercase;
  }
  .tile img { max-width: 100%; height: auto; }

  .thumbnail-container {
    width: 100%; height: 280px; background: white; color: grey; font-size: 12em;
  }
  .thumbnail-container p { margin: 0; }

  .copy-icon { display: inline-block; cursor: pointer; font-size: 8px; }
  .tile:hover .copy-icon { text-decoration: underline; }

  /* Pasek narzędzi */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .toolbar .group { display: flex; align-items: center; gap: 8px; }

  /* Zakładki oparte o radiobuttony */
  .tabs {
    display: flex; gap: 4px; align-items: flex-end;
  }
  .tabs input[type="radio"] { display: none; }

  .tab-label {
    padding: 8px 14px;
    border: 1px solid #ccc;
    border-bottom: none;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    background: #f2f2f2;
    cursor: pointer;
    font-weight: 600;
    user-select: none;
  }
  /* aktywna zakładka */
  .tabs input[type="radio"]:checked + label {
    background: #fff;
    border-color: #aaa;
    position: relative;
    top: 1px;
  }

  /* Pasek pod zakładkami (linia) */
  .tabs-underline {
    width: 100%;
    height: 1px;
    background: #aaa;
    margin-top: -1px;
    margin-bottom: 8px;
  }

  /* Checkboxy FF */
  .ff-filters label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px; }
  .ff-filters input { transform: scale(1.1); }

  /* Pole wyszukiwania */
  #search { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; min-width: 220px; }

  /* Kontener kafli */
  #tiles-container::after { content: ""; display: block; clear: both; }
</style>
</head>
<body>

  <div class="toolbar">
    <!-- Zakładki (radiobuttony) zamiast selecta: WSZYSTKO / MAM / SZUKAM / DUBLE -->
    <div class="group" style="flex: 1 1 380px; min-width: 320px;">
      <div class="tabs" id="stock-tabs">
        <input type="radio" name="tab" id="tab-all" value="all" checked>
        <label class="tab-label" for="tab-all">WSZYSTKO</label>

        <input type="radio" name="tab" id="tab-owned" value="owned">
        <label class="tab-label" for="tab-owned">MAM</label>

        <input type="radio" name="tab" id="tab-wanted" value="wanted">
        <label class="tab-label" for="tab-wanted">SZUKAM</label>

        <input type="radio" name="tab" id="tab-duble" value="duble">
        <label class="tab-label" for="tab-duble">DUBLE</label>
      </div>
    </div>

    <div class="tabs-underline"></div>

    <!-- Checkboxy FF (ECHO / JAM) -->
    <div class="group ff-filters">
      <strong>FF:</strong>
      <label><input type="checkbox" id="ff-echo" checked> ECHO</label>
      <label><input type="checkbox" id="ff-jam" checked> JAM</label>
    </div>

    <!-- Wyszukiwarka -->
    <div class="group">
      <label for="search"><strong>Wyszukaj:</strong></label>
      <input type="text" id="search" placeholder="artysta / album / FF">
    </div>
  </div>

  <div id="tiles-container"></div>

<script>
  const sheetUrlCSV = 'https://docs.google.com/spreadsheets/d/1hTaNoVxeK5HBXI7FHMMPKznvILbudUpxgRslYouw34Q/export?format=csv';

  // Prosty parser CSV (bez obsługi zagnieżdżonych przecinków w cudzysłowie)
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    return lines.map(line => line.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
  }

  let cachedRows = null; // proste cache w pamięci strony

  async function fetchData() {
    if (cachedRows) return cachedRows;
    const response = await fetch(sheetUrlCSV);
    if (!response.ok) throw new Error('Nie udało się pobrać danych z arkusza');

    const csvText = await response.text();
    const rows = parseCSV(csvText);
    cachedRows = rows;
    return rows;
  }

  function getActiveStockFilter() {
    const checked = document.querySelector('#stock-tabs input[type="radio"]:checked');
    return checked ? checked.value : 'all';
  }

  function getActiveFFFilters() {
    const echo = document.getElementById('ff-echo').checked;
    const jam  = document.getElementById('ff-jam').checked;
    const selected = [];
    if (echo) selected.push('echo');
    if (jam)  selected.push('jam');
    return selected; // może być pusta tablica => nic nie pokaże
  }

  async function applyFiltersAndRender() {
    try {
      const rows = await fetchData();

      const headers = rows[0];
      const dataRows = rows.slice(1);

      // Indeksy kolumn dopasowane do Twojego arkusza
      const idxFF        = 0;  // kolumna FF: ECHO / JAM
      const idxNr        = 2;
      const idxArtysta   = 3;
      const idxAlbum     = 4;
      const idxIlosc     = 6;
      const idxKolor     = 9;
      const idxMiniatura = 10;

      const rowData = dataRows.map(cols => ({
        ff: (cols[idxFF] || '').trim(),             // ECHO / JAM
        nr: cols[idxNr] || '',
        artysta: cols[idxArtysta] || '',
        album: cols[idxAlbum] || '',
        ilosc: parseInt(cols[idxIlosc]) || 0,
        kolor: cols[idxKolor] || '',
        miniatura: cols[idxMiniatura] || ''
      })).filter(item => item.nr !== '');

      const stockFilter = getActiveStockFilter();           // all | owned | wanted | duble
      const ffSelected  = getActiveFFFilters();             // ['echo','jam'] / ['echo'] / ['jam'] / []
      const q           = (document.getElementById('search').value || '').toLowerCase();

      renderTiles(rowData, { stockFilter, ffSelected, q });

    } catch (error) {
      console.error('Błąd pobierania danych:', error);
      const tilesContainer = document.getElementById('tiles-container');
      tilesContainer.innerHTML = '<p style="color:red;">Błąd pobierania danych z arkusza. Sprawdź konsolę.</p>';
    }
  }

  function renderTiles(data, { stockFilter, ffSelected, q }) {
    const tilesContainer = document.getElementById('tiles-container');
    tilesContainer.innerHTML = '';

    const filtered = data.filter(item => {
      const ilosc = item.ilosc;

      // Filtr zakładką (stan posiadania)
      const stockOK =
        stockFilter === 'all' ||
        (stockFilter === 'owned'  && ilosc > 0) ||
        (stockFilter === 'wanted' && ilosc < 1) ||
        (stockFilter === 'duble'  && ilosc > 1);

      // Filtr FF (checkboxy)
      const ffLower = (item.ff || '').toLowerCase();
      const ffOK = ffSelected.length === 0 ? false : ffSelected.includes(ffLower); // brak zaznaczeń => nic nie pokazuj

      // Szukajka: artysta / album / FF
      const searchOK =
        q === '' ||
        (item.artysta || '').toLowerCase().includes(q) ||
        (item.album   || '').toLowerCase().includes(q) ||
        ffLower.includes(q);

      return stockOK && ffOK && searchOK;
    });

    filtered.forEach(item => tilesContainer.appendChild(createTile(item)));
  }

  function createTile(item) {
    const { ff, nr, artysta, album, ilosc, kolor, miniatura } = item;

    const tile = document.createElement('div');
    tile.classList.add('tile');

    const kafelColor = kolor ? kolor.toLowerCase() : '#555555';
    tile.style.backgroundColor = kafelColor;
    tile.style.color = kafelColor === '#000000' ? 'gold' : 'white';
    tile.style.width = '280px';
    tile.style.height = '450px';
    tile.style.fontFamily = 'sans-serif';
    tile.style.border = ilosc === 0 ? '5px solid red' : '5px solid #ddd';

    // miniatura
    const thumbnailContainer = document.createElement('div');
    thumbnailContainer.classList.add('thumbnail-container');
    thumbnailContainer.style.width = '100%';
    thumbnailContainer.style.height = '280px';

    const thumbnailImage = document.createElement('div');
    thumbnailImage.classList.add('thumbnail-image');

    if (miniatura && miniatura !== '') {
      const imageElement = document.createElement('img');
      imageElement.src = miniatura;
      imageElement.loading = "lazy";
      thumbnailImage.appendChild(imageElement);
      thumbnailContainer.appendChild(thumbnailImage);
    } else if (kafelColor === '#000000') {
      thumbnailContainer.style.background = '#000000';
    } else {
      thumbnailImage.innerHTML = `<p><strong>?</strong></p>`;
      thumbnailContainer.appendChild(thumbnailImage);
    }

    tile.appendChild(thumbnailContainer);

    // artysta
    const artistElement = document.createElement('p');
    artistElement.innerHTML = `<strong>${artysta}</strong> <span class="copy-icon" onclick="copyToClipboard('${artysta.replace(/'/g,"\\'")}')">(kopiuj)</span>`;
    tile.appendChild(artistElement);

    // album
    const albumElement = document.createElement('p');
    albumElement.innerHTML = `${album} <span class="copy-icon" onclick="
