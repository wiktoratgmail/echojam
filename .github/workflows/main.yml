name: Update Images
on:
  push:
    branches: [gh-pages]

permissions:
  contents: write  # Kluczowe dla pusha do repozytorium [web:43][web:45][attached_file:1]

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: gh-pages
        fetch-depth: 0  # Pozwala na historię commitów [web:49]

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run script to update images
      run: python scripts/update_images.py

    - name: Commit and push changes
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add img/ || echo "No images to add"
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update images [skip ci] $(date -u)"
          git push origin gh-pages
        fi [web:7][web:49][attached_file:1]
