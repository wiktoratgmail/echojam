name: Update Images
on:
  push:
    branches: [gh-pages]

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # Zaktualizuj do v4
      
    - uses: actions/setup-python@v5  # v5
      with:
        python-version: '3.x'
        
    - run: |
        python -m pip install --upgrade pip
        pip install requests
      shell: bash
        
    - run: python scripts/update_images.py
      
    - name: Commit and push changes
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add img
        git commit -m "Update images [skip ci]" || echo "No changes"
        git push
